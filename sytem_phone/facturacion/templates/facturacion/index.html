{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iniciar Sesión | DDMAX MOTO IMPORT</title>
    <link rel="shortcut icon" href="{% static 'image/favicon2.ico' %}" type="image/x-icon">
    <!-- Google Fonts para igualar la elegancia de la referencia -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Colores adaptados a tu marca DDMAX (Cyan y Oscuros) */
            --primary: #00d2ff;      /* El color de acento principal */
            --primary-hover: #00b8e6;
            --bg-card: #1c1e26;      /* Fondo sólido oscuro de la tarjeta (como en la foto) */
            --bg-input: #111217;     /* Fondo más oscuro para los inputs */
            --border-color: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-muted: #a0aec0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #05080f;
            
            /* Fondo con oscurecimiento idéntico al de la foto de referencia */
            background-image: 
                linear-gradient(rgba(10, 12, 18, 0.8), rgba(5, 6, 10, 0.95)),
                url("{% static 'image/fondo_login.png' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .login-card {
            background-color: var(--bg-card);
            width: 100%;
            max-width: 420px;
            border-radius: 20px; /* Bordes redondeados prominentes */
            padding: 3rem 2.5rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 10;
        }

        /* Resplandor (Glow) detrás del logo, replicando el efecto rojo de la foto pero en cyan */
        .logo-container {
            position: relative;
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            background-color: var(--primary);
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.35;
            z-index: 0;
        }

        .logo-img {
            width: 85px;
            height: auto;
            position: relative;
            z-index: 1;
        }

        .brand-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 1px;
            margin-bottom: 0.4rem;
        }

        .brand-subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.6rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
        }

        /* Iconos al lado izquierdo (Usuario y Candado) */
        .input-icon-left {
            position: absolute;
            left: 1.2rem;
            width: 18px;
            height: 18px;
            color: var(--primary); /* El icono toma el color principal como en la referencia */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .input-icon-left svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        .input-field {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            padding: 1.1rem 1.2rem 1.1rem 3.2rem; /* Espacio para el icono a la izquierda */
            outline: none;
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        /* Icono al lado derecho (Ojo de mostrar contraseña) */
        .input-icon-right {
            position: absolute;
            right: 1.2rem;
            width: 20px;
            height: 20px;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .input-icon-right:hover {
            color: var(--text-main);
        }

        /* Botón de acceso sólido estilo la foto */
        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: #000000; /* Texto oscuro para contrastar */
            border: none;
            padding: 1.2rem;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Alertas de error de Django */
        .error-alert {
            background: rgba(255, 74, 74, 0.1);
            border-left: 3px solid #ff4a4a;
            border-radius: 6px;
            padding: 0.8rem 1rem;
            margin-bottom: 1.5rem;
        }

        .error-alert ul {
            list-style: none;
            color: #ffb3b3;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .error-alert li {
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        
        <div class="logo-container">
            <div class="logo-glow"></div>
            <img src="{% static 'image/favicon2.ico' %}" alt="Logo DDMAX" class="logo-img">
        </div>

        <h1 class="brand-title">DDMAX MOTO</h1>
        <p class="brand-subtitle">Sistema de Gestión de Facturación</p>

        {% if messages %}
        <div class="error-alert" id="error-alert">
            <ul>
                {% for message in messages %}
                <li>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    {{ message }}
                </li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Usuario</label>
                <div class="input-wrapper">
                    <div class="input-icon-left">
                        <!-- Icono SVG de Usuario -->
                        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </div>
                    <input type="text" id="username" name="username" class="input-field" placeholder="Ingresa tu usuario" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <div class="input-icon-left">
                        <!-- Icono SVG de Candado -->
                        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                    </div>
                    <input type="password" id="password" name="password" class="input-field" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                    
                    <div class="input-icon-right" id="toggle-password" title="Mostrar/Ocultar">
                        <!-- Icono SVG de Ojo Tachado (por defecto) -->
                        <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">
                ACCEDER AL SISTEMA
            </button>
        </form>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Lógica para mostrar/ocultar contraseña (replicando la funcionalidad de la foto)
            const togglePassword = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');

            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Cambiar el icono SVG
                if (type === 'text') {
                    // Ojo abierto
                    eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
                } else {
                    // Ojo cerrado (tachado)
                    eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
                }
            });

            // Auto-ocultar las alertas de error de Django tras 5 segundos
            const errorAlert = document.getElementById('error-alert');
            if (errorAlert) {
                setTimeout(() => {
                    errorAlert.style.transition = 'opacity 0.5s ease';
                    errorAlert.style.opacity = '0';
                    setTimeout(() => errorAlert.remove(), 500);
                }, 5000);
            }
            
            // Estado de carga en el botón
            const form = document.querySelector('form');
            const submitBtn = document.getElementById('submit-btn');
            form.addEventListener('submit', (e) => {
                const user = document.getElementById('username').value.trim();
                const pass = passwordInput.value.trim();
                if (user && pass) {
                    submitBtn.textContent = 'AUTENTICANDO...';
                    submitBtn.style.opacity = '0.8';
                    submitBtn.style.pointerEvents = 'none';
                }
            });
        });
    </script>
</body>
</html>
